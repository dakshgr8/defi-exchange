specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: LiquidityPool
    network: sepolia
    source:
      address: "0xA4B9B7d23c7d7eB0315Fdd116AB6D8898B563e8E"
      abi: LiquidityPool
      startBlock: 11451500
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapEvent
        - PoolSnapshot
      abis:
        - name: LiquidityPool
          file: ./abis/LiquidityPool.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Sync(uint256,uint256)
          handler: handleSync
      file: ./src/mapping.ts
